name: test

on:
  push:
    branches:
      - main

  pull_request:

# Cancel running jobs for the same workflow and branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and Check Package
        uses: hynek/build-and-inspect-python-package@v2.18

  test:

    needs: [package]

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false

      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        qt-lib: [pyqt5, pyqt6, pyside6]
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Python 3.9 is not available on ubuntu-latest (Ubuntu 26.04).
          - python-version: "3.9"
            qt-lib: pyqt5
            os: ubuntu-24.04
          - python-version: "3.9"
            qt-lib: pyqt6
            os: ubuntu-24.04
          - python-version: "3.9"
            qt-lib: pyside6
            os: ubuntu-24.04
          - python-version: "3.9"
            qt-lib: pyqt61
            os: ubuntu-24.04
          - python-version: "3.9"
            qt-lib: pyside60
            os: ubuntu-24.04
        exclude:
          - python-version: "3.9"
            os: ubuntu-latest
          # No PySide6 release supports Python 3.15 yet (all declare
          # Requires-Python <3.15), so it cannot be installed.
          - python-version: "3.15"
            qt-lib: pyside6

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Download Package
      uses: actions/download-artifact@v8
      with:
        name: Packages
        path: dist

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
        if [ "${{ runner.os }}" == "Linux" ]; then
          sudo apt-get update -y
          sudo apt-get install -y libgles2-mesa-dev
        fi
      shell: bash

    - name: Test
      shell: bash
      run: |
        tox -e py-${{ matrix.qt-lib }} --installpkg `find dist/*.tar.gz` -- -ra
