[mypy]
exclude = ^docs/
mypy_path = src
pretty = True
show_error_codes = True
strict = True

# The modules below do not pass strict mode yet. Remove a module from
# these lists once it is fully annotated, so it cannot regress.

[mypy-pytestqt.plugin,pytestqt.qt_compat,pytestqt.qtbot]
disallow_untyped_calls = False
disallow_untyped_defs = False

[mypy-pytestqt.exceptions,pytestqt.logging,pytestqt.modeltest,pytestqt.wait_signal]
check_untyped_defs = False
disallow_untyped_calls = False
disallow_untyped_defs = False

[mypy-test_logging]
disallow_untyped_calls = False
disallow_untyped_defs = False

[mypy-conftest,test_basics,test_exceptions,test_modeltest,test_wait_signal]
check_untyped_defs = False
disallow_untyped_calls = False
disallow_untyped_defs = False
# Qt classes are ``Any`` when no Qt binding is installed (as in pre-commit).
disallow_subclassing_any = False
