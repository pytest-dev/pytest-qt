[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "UP", # pyupgrade
]
ignore = [
    "UP031", # printf-string-formatting, not enforced by pyupgrade
    "UP032", # f-string, not enforced by pyupgrade
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120
